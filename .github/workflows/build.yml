name: Build package

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if (-not $version) { throw "VERSION is empty" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate repository
        shell: pwsh
        run: python tools/validate.py

      - name: Test universal development entry
        shell: pwsh
        run: ./tools/test-dev-entry.ps1

      - name: Test standalone one-file VBS
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/test-standalone-vbs.ps1

      - name: Test latest-release install flow
        shell: pwsh
        run: ./tools/test-install-latest.ps1

      - name: Test Xbox installer
        shell: pwsh
        run: ./tools/test-deploy-xbox-dev.ps1

      - name: Test release boundary
        shell: pwsh
        run: ./tools/assert-self-contained-release.ps1

      - name: Build .pak
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.ps1 -Configuration $env:VERSION

      - name: Test native radial capture
        shell: pwsh
        run: ./tools/test-capture-native-radials.ps1

      - name: Test portable developer capture
        shell: pwsh
        run: ./tools/test-dev-capture.ps1

      - name: Verify packaged contents
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/verify-package.ps1 -Package "./build/BG3ControllerActionMenu-$env:VERSION.pak"

      - name: Build hidden one-click installer
        shell: pwsh
        run: ./tools/build-one-click-installer.ps1

      - name: Record immutable CI candidate identity (not game validation)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
        run: |
          $pak = "build/BG3ControllerActionMenu-$env:VERSION.pak"
          if (-not (Test-Path -LiteralPath $pak -PathType Leaf)) { throw "Missing built PAK: $pak" }
          $sha = (Get-FileHash -LiteralPath $pak -Algorithm SHA256).Hash.ToLowerInvariant()
          $checkedOut = (git rev-parse HEAD).Trim()
          $identity = [ordered]@{
            schemaVersion = 1
            role = "CI package provenance only; not an installed-game or runtime pass"
            version = $env:VERSION
            gameTarget = "Xbox App PC Patch 8 (1.8.910.0)"
            sourceHeadSha = $env:SOURCE_SHA
            checkoutCommitSha = $checkedOut
            workflowRunId = $env:WORKFLOW_RUN_ID
            workflowEventName = $env:WORKFLOW_EVENT_NAME
            pakFileName = (Split-Path $pak -Leaf)
            pakSha256 = $sha
            pakSizeBytes = (Get-Item -LiteralPath $pak).Length
          }
          $identity | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath "build/candidate-identity.json" -Encoding utf8

      - name: Upload package and installer
        uses: actions/upload-artifact@v4
        with:
          name: BG3ControllerActionMenu-${{ steps.version.outputs.version }}-run-${{ github.run_id }}
          path: |
            build/BG3ControllerActionMenu-${{ steps.version.outputs.version }}.pak
            build/candidate-identity.json
            tools/install-xbox-dev.ps1
            tools/Install-BG3ControllerActionMenu.vbs
            tools/dev-entry.ps1
            tools/install-latest.ps1
            build/BG3ControllerActionMenu-OneClickInstaller.zip
            tools/capture-native-radials.ps1
            tools/capture-self-contained-inputs.ps1
          if-no-files-found: error
