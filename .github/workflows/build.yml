name: Build package

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if (-not $version) { throw "VERSION is empty" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate repository
        shell: pwsh
        run: python tools/validate.py

      - name: Test Xbox installer
        shell: pwsh
        run: ./tools/test-deploy-xbox-dev.ps1

      - name: Build .pak
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.ps1 -Configuration $env:VERSION

      - name: Verify packaged contents
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/verify-package.ps1 -Package "./build/BG3ControllerActionMenu-$env:VERSION.pak"

      - name: Upload package and installer
        uses: actions/upload-artifact@v4
        with:
          name: BG3ControllerActionMenu-${{ steps.version.outputs.version }}
          path: |
            build/BG3ControllerActionMenu-${{ steps.version.outputs.version }}.pak
            tools/install-xbox-dev.ps1
          if-no-files-found: error
