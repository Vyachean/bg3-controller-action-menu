name: Build probe

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate XML/LSX
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File -Include *.xml,*.lsx | ForEach-Object {
            try {
              [xml](Get-Content -Raw $_.FullName) | Out-Null
              Write-Host "OK $($_.FullName)"
            } catch {
              throw "Invalid XML/LSX: $($_.FullName): $($_.Exception.Message)"
            }
          }

      - name: Build .pak
        shell: pwsh
        run: ./build.ps1

      - name: Upload probe package
        uses: actions/upload-artifact@v4
        with:
          name: BG3ControllerActionMenu-probe
          path: build/BG3ControllerActionMenu-probe.pak
          if-no-files-found: error
