name: Research radial hotbar reference

on:
  pull_request:
    paths:
      - ".github/workflows/research-radial-hotbar-reference.yml"

permissions:
  contents: read

jobs:
  inspect-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download immutable public source archive without executing it
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2             "https://gitlab.com/saghm/RadialHotbarCustomization/-/archive/v0.8.0.0/RadialHotbarCustomization-v0.8.0.0.zip"             -o /tmp/rhc.zip
          mkdir /tmp/rhc
          unzip -q /tmp/rhc.zip -d /tmp/rhc

      - name: Print bounded controller container excerpts
        shell: python
        run: |
          from pathlib import Path

          roots = list(Path("/tmp/rhc").glob("RadialHotbarCustomization-v0.8.0.0"))
          if len(roots) != 1:
              raise SystemExit("unexpected archive root")
          root = roots[0]
          excerpts = {
              "src/entity.d.tl": (1, 70),
              "src/tl/Server/Player.tl": (30, 165),
              "src/tl/Server/PersistentTypes.tl": (1, 55),
          }
          for rel, (start, end) in excerpts.items():
              path = root / rel
              lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
              print(f"## {rel} {start}-{end}")
              for lineno in range(start, min(end, len(lines)) + 1):
                  print(f"{lineno}: {lines[lineno - 1][:360]}")
