name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python tools/validate.py
      - name: Track source shape of known runtime failures (NOT gameplay verification)
        run: python tools/audit-controller-known-runtime-failures.py --assert-original-shape
      - name: Audit exact native B/metamagic command ownership (NOT gameplay verification)
        run: python tools/audit-controller-known-runtime-failures.py --assert-cancel-source
      - name: Check one native metamagic directional owner (NOT gameplay verification)
        run: python tools/audit-metamagic-directional-owner.py --self-test
