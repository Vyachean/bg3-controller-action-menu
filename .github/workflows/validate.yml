name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  package-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate parseable package inputs only (not game behavior)
        run: python tools/validate.py
      - name: Check optional native-source diagnostic parser (synthetic fixtures only)
        run: python tools/trace-upcast-parity.py --self-test

      - name: Check read-only gameplay inventory analyzer (synthetic fixtures only)
        run: python tools/analyze-gameplay-inventory.py --self-test
