name: Release

on:
  push:
    branches: ["main"]
    paths:
      - "VERSION"
      - "BG3ControllerActionMenu/**"
      - "build.ps1"
      - ".github/workflows/release.yml"
      - "tools/verify-package.ps1"
      - "tools/validate.py"
      - "tools/install-xbox-dev.ps1"
      - "tools/bootstrap-latest.ps1"
      - "tools/test-bootstrap-latest.ps1"
      - "tools/install-latest.ps1"
      - "tools/native-overlay.ps1"
      - "tools/test-native-overlay.ps1"
      - "tools/Install-BG3ControllerActionMenu.vbs"
      - "tools/test-install-latest.ps1"
      - "tools/build-one-click-installer.ps1"
      - "tools/deploy-xbox-dev.ps1"
      - "tools/test-deploy-xbox-dev.ps1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if (-not $version) { throw "VERSION is empty" }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "VERSION must be SemVer-like, got '$version'"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check whether release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0

          if ($exists) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:TAG already exists; publication is immutable and will be skipped."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:TAG does not exist and will be published."
          }

      - uses: actions/setup-python@v5
        if: steps.existing.outputs.exists != 'true'
        with:
          python-version: "3.x"

      - name: Validate repository
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: python tools/validate.py

      - name: Test minimal installer bootstrap
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./tools/test-bootstrap-latest.ps1

      - name: Test latest-release install flow
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./tools/test-install-latest.ps1

      - name: Test Xbox installer
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./tools/test-deploy-xbox-dev.ps1

      - name: Test native action tabs
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./tools/test-native-overlay.ps1

      - name: Build package
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.ps1 -Configuration $env:VERSION

      - name: Verify packaged contents
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/verify-package.ps1 -Package "./build/BG3ControllerActionMenu-$env:VERSION.pak"

      - name: Build hidden one-click installer
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./tools/build-one-click-installer.ps1

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $pak = "build/BG3ControllerActionMenu-$env:VERSION.pak"
          if (-not (Test-Path $pak)) { throw "Missing release package: $pak" }

          $installer = "tools/install-xbox-dev.ps1"
          if (-not (Test-Path $installer)) { throw "Missing Xbox installer: $installer" }

          $oneClick = "build/BG3ControllerActionMenu-OneClickInstaller.zip"
          if (-not (Test-Path $oneClick)) { throw "Missing one-click installer bundle: $oneClick" }

          $overlay = "tools/native-overlay.ps1"
          if (-not (Test-Path $overlay)) { throw "Missing native overlay builder: $overlay" }

          $bootstrap = "tools/bootstrap-latest.ps1"
          if (-not (Test-Path $bootstrap)) { throw "Missing installer bootstrap: $bootstrap" }

          $latestInstaller = "tools/install-latest.ps1"
          if (-not (Test-Path $latestInstaller)) { throw "Missing canonical latest-release installer: $latestInstaller" }

          $args = @(
            "release", "create", $env:TAG, $pak, $installer, $oneClick, $overlay, $bootstrap, $latestInstaller,
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", "BG3 Controller Action Menu $env:TAG",
            "--generate-notes"
          )

          if ($env:VERSION -match '-') {
            $args += "--prerelease"
          }

          gh @args
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }

      - name: Verify published release is installer-visible
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "BG3ControllerActionMenu-ReleaseVerifier"
          }

          $releases = @(Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=20" -Headers $headers)
          $published = @(
            $releases |
              Where-Object { -not $_.draft -and $_.published_at -and $_.tag_name } |
              Sort-Object { [DateTimeOffset]$_.published_at } -Descending
          )

          if ($published.Count -eq 0) {
            throw "No published release found after release publication."
          }

          $latest = $published[0]
          if ([string]$latest.tag_name -ne $env:TAG) {
            throw "Expected newest published release '$env:TAG', got '$($latest.tag_name)'."
          }

          $requiredAssets = @(
            "BG3ControllerActionMenu-$env:VERSION.pak",
            "BG3ControllerActionMenu-OneClickInstaller.zip",
            "bootstrap-latest.ps1",
            "install-latest.ps1",
            "install-xbox-dev.ps1",
            "native-overlay.ps1"
          )
          $assetNames = @($latest.assets | ForEach-Object { [string]$_.name })
          foreach ($required in $requiredAssets) {
            if ($assetNames -notcontains $required) {
              throw "Published release '$env:TAG' is missing required asset '$required'."
            }
          }

          $resolveRoot = Join-Path $env:RUNNER_TEMP "release-resolve-proof"
          New-Item -ItemType Directory -Force -Path $resolveRoot | Out-Null
          $status = Join-Path $resolveRoot "status.txt"
          $log = Join-Path $resolveRoot "install.log"
          $report = Join-Path $resolveRoot "report.json"
          $cache = Join-Path $resolveRoot "cache"

          ./tools/install-latest.ps1 -ResolveOnly -CacheRoot $cache -StatusPath $status -LogPath $log -ReportPath $report

          if ($LASTEXITCODE -ne 0) {
            throw "Canonical installer resolver failed against live GitHub Releases."
          }

          $statusLines = @(Get-Content -LiteralPath $status -Encoding Unicode)
          if ($statusLines.Count -lt 2 -or $statusLines[0] -ne "SUCCESS" -or $statusLines[1] -ne $env:VERSION) {
            throw "Canonical installer resolver did not select expected version '$env:VERSION'."
          }

          Write-Host "Published release $env:TAG is complete and selected by the canonical installer."
