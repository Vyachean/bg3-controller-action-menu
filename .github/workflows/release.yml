name: Release

on:
  push:
    branches: ["main"]
    paths:
      - "VERSION"
      - "BG3ControllerActionMenu/**"
      - "build.ps1"
      - ".github/workflows/release.yml"
      - "tools/verify-package.ps1"
      - "tools/validate.py"
      - "tools/assert-self-contained-release.ps1"
      - "tools/test-self-contained-runtime.ps1"
      - "docs/evidence/patch8-1.8.910.0-runtime-contract.json"
      - "tools/install-xbox-dev.ps1"
      - "tools/dev-entry.ps1"
      - "tools/test-dev-entry.ps1"
      - "tools/install-latest.ps1"
      - "tools/Install-BG3ControllerActionMenu.vbs"
      - "tools/test-install-latest.ps1"
      - "tools/build-one-click-installer.ps1"
      - "tools/deploy-xbox-dev.ps1"
      - "tools/test-deploy-xbox-dev.ps1"
      - "tools/capture-self-contained-inputs.ps1"
      - "tools/test-dev-capture.ps1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if (-not $version) { throw "VERSION is empty" }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "VERSION must be SemVer-like, got '$version'"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check whether release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0

          if ($exists) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:TAG already exists; publication is immutable and will be skipped."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:TAG does not exist and will be published."
          }

      - uses: actions/setup-python@v5
        if: steps.existing.outputs.exists != 'true'
        with:
          python-version: "3.x"

      - name: Validate repository
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: python tools/validate.py

      - name: Test universal development entry
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./tools/test-dev-entry.ps1

      - name: Test latest-release install flow
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./tools/test-install-latest.ps1

      - name: Test Xbox installer
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./tools/test-deploy-xbox-dev.ps1

      - name: Test self-contained Patch 8 runtime
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./tools/test-self-contained-runtime.ps1

      - name: Require self-contained runtime
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./tools/assert-self-contained-release.ps1

      - name: Build package
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.ps1 -Configuration $env:VERSION

      - name: Verify packaged contents
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/verify-package.ps1 -Package "./build/BG3ControllerActionMenu-$env:VERSION.pak"

      - name: Build hidden one-click installer
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./tools/build-one-click-installer.ps1

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $pak = "build/BG3ControllerActionMenu-$env:VERSION.pak"
          if (-not (Test-Path $pak)) { throw "Missing release package: $pak" }

          $installer = "tools/install-xbox-dev.ps1"
          if (-not (Test-Path $installer)) { throw "Missing Xbox installer: $installer" }

          $oneClick = "build/BG3ControllerActionMenu-OneClickInstaller.zip"
          if (-not (Test-Path $oneClick)) { throw "Missing one-click installer bundle: $oneClick" }

          $launcher = "tools/Install-BG3ControllerActionMenu.vbs"
          if (-not (Test-Path $launcher)) { throw "Missing development VBS launcher: $launcher" }

          $devEntry = "tools/dev-entry.ps1"
          if (-not (Test-Path $devEntry)) { throw "Missing universal development entry: $devEntry" }

          $latestInstaller = "tools/install-latest.ps1"
          if (-not (Test-Path $latestInstaller)) { throw "Missing canonical latest-release installer: $latestInstaller" }

          $capture = "tools/capture-self-contained-inputs.ps1"
          if (-not (Test-Path $capture)) { throw "Missing developer capture helper: $capture" }

          $args = @(
            "release", "create", $env:TAG, $pak, $installer, $oneClick, $launcher, $devEntry, $latestInstaller, $capture,
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", "BG3 Controller Action Menu $env:TAG",
            "--generate-notes"
          )

          if ($env:VERSION -match '-') {
            $args += "--prerelease"
          }

          gh @args
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }

      - name: Verify published release is installer-visible
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $releaseJson = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,publishedAt,assets
          if ($LASTEXITCODE -ne 0) {
            throw "Expected published release '$env:TAG' was not found."
          }

          $release = $releaseJson | ConvertFrom-Json
          if ([string]$release.tagName -ne $env:TAG -or $release.isDraft) {
            throw "Release '$env:TAG' is missing or still a draft."
          }

          $requiredAssets = @(
            "BG3ControllerActionMenu-$env:VERSION.pak",
            "BG3ControllerActionMenu-OneClickInstaller.zip",
            "Install-BG3ControllerActionMenu.vbs",
            "dev-entry.ps1",
            "install-latest.ps1",
            "install-xbox-dev.ps1",
            "capture-self-contained-inputs.ps1"
          )
          $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
          foreach ($required in $requiredAssets) {
            if ($assetNames -notcontains $required) {
              throw "Published release '$env:TAG' is missing required asset '$required'."
            }
          }

          $resolveRoot = Join-Path $env:RUNNER_TEMP "release-resolve-proof"
          New-Item -ItemType Directory -Force -Path $resolveRoot | Out-Null
          $status = Join-Path $resolveRoot "status.txt"
          $log = Join-Path $resolveRoot "install.log"
          $report = Join-Path $resolveRoot "report.json"
          $cache = Join-Path $resolveRoot "cache"

          # GitHub's exact-tag endpoint can expose a newly created release well
          # before the releases collection used by the universal launcher does.
          # Keep proving visibility with the release-controlled entry itself. A bounded
          # wall-clock deadline is more robust than a tiny fixed retry count while
          # exponential backoff avoids hammering the Releases API.
          $resolved = $false
          $attempt = 0
          $delaySeconds = 2
          $deadline = (Get-Date).ToUniversalTime().AddMinutes(5)

          while ((Get-Date).ToUniversalTime() -lt $deadline) {
            $attempt++
            Remove-Item -LiteralPath $status -Force -ErrorAction SilentlyContinue
            ./tools/dev-entry.ps1 -ResolveOnly -CacheRoot $cache -StatusPath $status -LogPath $log -ReportPath $report

            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $status)) {
              $statusLines = @(Get-Content -LiteralPath $status -Encoding Unicode)
              if ($statusLines.Count -ge 2 -and
                  $statusLines[0] -eq "SUCCESS" -and
                  $statusLines[1] -eq $env:VERSION) {
                $resolved = $true
                break
              }

              $observed = if ($statusLines.Count -ge 2) { $statusLines[1] } else { "<none>" }
              Write-Host "Universal entry visibility attempt $attempt still resolves '$observed'."
            } else {
              Write-Host "Universal entry visibility attempt $attempt did not resolve successfully."
            }

            $remainingSeconds = [Math]::Max(
              0,
              [Math]::Ceiling(($deadline - (Get-Date).ToUniversalTime()).TotalSeconds)
            )
            if ($remainingSeconds -le 0) {
              break
            }

            $sleepSeconds = [Math]::Min($delaySeconds, $remainingSeconds)
            Start-Sleep -Seconds $sleepSeconds
            $delaySeconds = [Math]::Min(15, $delaySeconds * 2)
          }

          if (-not $resolved) {
            throw "Universal development entry did not select expected version '$env:VERSION' within the five-minute publication propagation window after $attempt attempts."
          }

          Write-Host "Published release $env:TAG is complete and selected by the universal development entry."
