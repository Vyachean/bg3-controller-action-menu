name: Release

on:
  push:
    branches: ["main"]
    paths:
      - "VERSION"
      - "BG3ControllerActionMenu/**"
      - "build.ps1"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if (-not $version) { throw "VERSION is empty" }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "VERSION must be SemVer-like, got '$version'"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check whether release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:TAG already exists; publication is immutable and will be skipped."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build package
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.ps1 -Configuration $env:VERSION

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $pak = "build/BG3ControllerActionMenu-$env:VERSION.pak"
          if (-not (Test-Path $pak)) { throw "Missing release package: $pak" }

          $args = @(
            "release", "create", $env:TAG, $pak,
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", "BG3 Controller Action Menu $env:TAG",
            "--generate-notes"
          )

          if ($env:VERSION -match '-') {
            $args += "--prerelease"
          }

          gh @args
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
